services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medledger
      POSTGRES_USER: medledger
      POSTGRES_PASSWORD: medledger
    ports:
      - "5432:5432"
    volumes:
      - medledger-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medledger -d medledger"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  medledger-postgres:
